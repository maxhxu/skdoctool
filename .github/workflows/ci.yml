# Gates every push to main and every PR. Deployment is still manual (see
# README "Deploying") — this only answers "would that deploy have worked?".
#
# The jobs mirror what a deploy actually does: run the Python API, build the
# frontend the way the nginx image builds it, and have nginx accept its
# config. A green run means all of that still holds.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless. Private
# repo, so Actions minutes are billed — don't burn them on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv has no moving major tag past v7, so this is pinned exactly.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --frozen: fail if uv.lock is out of date rather than silently
      # resolving something different from what a deploy would install.
      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run --frozen pytest tests/ -v

  # Two frontend jobs on two Node versions, deliberately — do not merge them.
  # jsdom@30 (the vitest environment) declares engines ^22.22.2 || ^24.15.0,
  # and its undici@8 dep calls worker_threads.markAsUncloneable, which simply
  # doesn't exist on Node 20. But production builds the bundle with
  # node:20-alpine, and vite@8 supports ^20.19.0 fine. jsdom is test-only and
  # never ships, so the two can differ: build on what production uses, test on
  # what the test tooling needs. npm only warns on engine mismatches, so
  # getting this wrong fails at runtime, not at install.
  frontend-build:
    name: Frontend lint and build (Node 20, production parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # 20 matches node:20-alpine in nginx/Dockerfile — the version that
      # actually builds the production bundle.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b && vite build: typecheck *and* production bundle, the same
      # command nginx/Dockerfile runs.
      - name: Typecheck and build
        run: npm run build

  frontend-tests:
    name: Frontend tests (Node 22, jsdom requirement)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

  nginx-config:
    name: nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A syntax error here doesn't fail a build — it takes the whole site
      # down on the next `docker compose up`, since nginx won't start. Cheap
      # to catch, expensive to miss.
      #
      # Two things make `nginx -t` pass outside production: a cert at the
      # path the config expects (nginx checks the file exists), and a
      # resolvable `app` host (it resolves upstreams at config-test time).
      - name: Validate rendered config
        run: |
          mkdir -p /tmp/certs/live/ci.example
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/certs/live/ci.example/privkey.pem \
            -out /tmp/certs/live/ci.example/fullchain.pem \
            -subj "/CN=ci.example" 2>/dev/null
          docker run --rm \
            -e DOMAIN=ci.example \
            --add-host app:127.0.0.1 \
            -v "$PWD/nginx/templates:/etc/nginx/templates:ro" \
            -v "/tmp/certs:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t
